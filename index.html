<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="lib/i18n.js"></script>
<title>Learning Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen you dive into. The glowing planet floats in a round lens;
   scroll, swipe or use the depth gauge on the right to sink through the
   levels of life, from a whole ecosystem down to molecules, each one a live
   simulation opening in the same lens. The log is the list view. One dark
   look by design: the deep sea. */
:root {
  --abyss: #020b10;
  --abyss-2: #06151d;
  --panel: rgba(4, 18, 26, 0.72);
  --ink: #e6fbff;
  --muted: #8fb3bd;
  --faint: #4f707a;
  --line: rgba(120, 230, 240, 0.18);
  --glow: #4ff0e0;
  --k-chemistry: #ffb547;
  --k-cells: #b4ff5a;
  --k-bodies: #ff6b9a;
  --k-nervous: #c08bff;
  --k-ecosystems: #4ff0e0;
  --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--abyss); color: var(--ink); font: 15px/1.5 var(--sans); overflow: hidden; }
body.listing { overflow: auto; }
a { color: var(--glow); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- The dive ---------- */
.dive { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #082430 0%, var(--abyss) 70%); touch-action: none; }
.dive canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sim { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
.sim canvas { background: #0b100e; will-change: transform; }
.sim::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 52%, rgba(2, 11, 16, 0.7) 71%); }
.sim .status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 86%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 13px var(--mono); color: var(--ink); background: rgba(2, 11, 16, 0.6); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; z-index: 1; }
#globe, #glow { pointer-events: none; }
#globe { z-index: 1; }
#glow { z-index: 3; mix-blend-mode: screen; }
#hit { z-index: 4; touch-action: none; cursor: grab; }
#hit.over { cursor: pointer; }
#hit.is-dragging { cursor: grabbing; }

/* ---------- HUD ---------- */
.bar { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.bar > * { pointer-events: auto; }
body.listing .bar { position: sticky; background: linear-gradient(var(--abyss) 70%, transparent); padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--glow); box-shadow: 0 0 14px var(--glow), inset 0 0 8px var(--glow); }
.brand b { font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: rgba(2, 11, 16, 0.5); backdrop-filter: blur(8px); }
.toggle button { border: 0; background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13.5px; }
.toggle button[aria-selected="true"] { background: var(--glow); color: var(--abyss); }
.ways { display: flex; gap: 6px; }
.ways a { text-decoration: none; color: var(--ink); font-size: 13.5px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: rgba(2, 11, 16, 0.5); backdrop-filter: blur(8px); }
.ways a:hover { border-color: var(--glow); }
.ways small { font: 11px var(--mono); color: var(--muted); }
.bar .lang .lang-switch { --accent: var(--glow); --surface: var(--abyss); color: var(--ink); background: rgba(2, 11, 16, 0.5); backdrop-filter: blur(8px); border-color: var(--line); }
.bar .lang .lang-switch a { padding: 6px 11px; }

/* The stop: what you are looking at. */
.stop {
  position: fixed; z-index: 5; left: max(20px, env(safe-area-inset-left, 0px)); bottom: 22px; width: min(440px, calc(100% - 140px));
  display: grid; gap: 10px; padding: 18px 20px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px);
  transition: opacity 250ms ease, transform 250ms ease;
}
.stop.fading { opacity: 0; transform: translateY(8px); }
.stop .depth { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--kc, var(--glow)); display: flex; gap: 10px; flex-wrap: wrap; }
.stop .depth span { color: var(--muted); }
.stop .into { color: var(--muted); font-size: 14px; margin-bottom: -6px; }
.stop h1, .stop h2 { margin: 0; font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; }
.stop h1 { font-size: clamp(34px, 4vw, 52px); }
.stop h1 em { font-style: normal; color: var(--glow); text-shadow: 0 0 24px rgba(79, 240, 224, 0.6); }
.stop h2 { font-size: clamp(30px, 3.4vw, 44px); }
.stop .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px var(--mono); color: var(--muted); }
.stop .facts b { color: var(--ink); font-weight: 500; }
.stop p { margin: 0; color: #c4dde3; }
.stop .ev { font-size: 13px; color: var(--muted); border-left: 2px solid var(--kc, var(--glow)); padding-left: 10px; }
.stop .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.stop .acts a, .stop .acts button { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; color: var(--ink); background: rgba(255, 255, 255, 0.03); cursor: pointer; }
.stop .acts .main { background: var(--kc, var(--glow)); color: var(--abyss); border-color: transparent; box-shadow: 0 0 22px color-mix(in srgb, var(--kc, var(--glow)) 45%, transparent); }
.stop .acts a:hover, .stop .acts button:hover { border-color: var(--kc, var(--glow)); }
.stop .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.stop .chips .lab { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.stop .steps { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.stop .steps button { border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.stop .steps button:hover { color: var(--ink); border-color: var(--glow); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; background: rgba(255, 255, 255, 0.02); cursor: pointer; font-size: 12.5px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
/* The key to the plates layer. */
.stop .key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12.5px; color: #c4dde3; border-top: 1px solid var(--line); padding-top: 9px; }
.stop .key-title { flex-basis: 100%; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.stop .key-title small { font: inherit; letter-spacing: 0; text-transform: none; color: var(--faint); margin-left: 6px; }
.stop .key-item { display: inline-flex; align-items: center; gap: 6px; }
.stop .key-item svg { width: 18px; height: 8px; flex: none; overflow: visible; }
.stop .key-hint { flex-basis: 100%; font-size: 12px; color: var(--muted); }

/* Depth gauge: the levels of life on a log scale of size. */
.gauge { position: fixed; z-index: 6; right: max(18px, env(safe-area-inset-right, 0px)); top: 76px; bottom: 26px; width: 200px; pointer-events: none; }
.gauge .rail { position: absolute; right: 18px; top: 0; bottom: 0; width: 2px; border-radius: 2px; pointer-events: auto; cursor: pointer; opacity: 0.8; }
.gauge .rail::before { content: ""; position: absolute; left: -12px; right: -12px; top: 0; bottom: 0; }
.gauge .lvl { position: absolute; right: 8px; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 2px 0; cursor: pointer; pointer-events: auto; color: var(--muted); font-size: 13px; font-weight: 500; text-align: right; }
.gauge .lvl i { order: 2; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); background: var(--abyss); box-shadow: 0 0 10px var(--c); }
.gauge .lvl:hover, .gauge .lvl[aria-current="true"] { color: var(--ink); }
.gauge .lvl[aria-current="true"] i { background: var(--c); }
.gauge .lvl small { display: block; font: 10.5px var(--mono); color: var(--faint); }
.gauge .here { position: absolute; right: 2px; width: 34px; height: 2px; transform: translateY(-1px); background: var(--ink); box-shadow: 0 0 12px var(--glow); }
.gauge .here { pointer-events: none; }
.gauge .here b { display: none; position: absolute; right: 40px; top: -9px; font: 500 11px var(--mono); color: var(--ink); white-space: nowrap; background: rgba(2, 11, 16, 0.7); padding: 1px 6px; border-radius: 4px; }

/* History strip at the surface: drag to age the planet. */
.history { position: fixed; z-index: 5; left: calc(min(440px, 100% - 140px) + 44px); right: 250px; bottom: 26px; display: grid; gap: 6px; transition: opacity 300ms ease; }
body.deep .history, body.deep .cue { opacity: 0; pointer-events: none; }
.history .label button { border: 0; background: none; padding: 0 0 0 8px; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--glow); cursor: pointer; }
.history .label { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.history .label b { color: var(--ink); font-weight: 500; }
.strip { position: relative; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); cursor: ew-resize; touch-action: none; }
.strip .eon { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--c) 30%, transparent); border-left: 1px solid rgba(255, 255, 255, 0.12); }
.strip .eon { overflow: hidden; }
.strip .eon span { position: absolute; left: 5px; top: 3px; font: 9.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: rgba(230, 251, 255, 0.75); white-space: nowrap; }
.strip .sys { position: absolute; top: 23px; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.strip .knob { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); box-shadow: 0 0 10px var(--glow); }

.cue { position: fixed; z-index: 4; left: 50%; top: 80%; transform: translateX(-50%); font: 12px var(--mono); color: var(--muted); display: grid; justify-items: center; gap: 3px; pointer-events: none; animation: bob 2.4s ease-in-out infinite; transition: opacity 300ms ease; }
.cue::after { content: ""; width: 1px; height: 16px; background: linear-gradient(var(--glow), transparent); }
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); opacity: 0.85; } 50% { transform: translate(-50%, 6px); opacity: 0.5; } }
.label-tip { position: fixed; z-index: 7; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); text-align: center; width: max-content; max-width: min(320px, calc(100vw - 20px)); background: rgba(2, 11, 16, 0.85); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; line-height: 1.35; }
.label-tip small { display: block; font: 11px/1.45 var(--mono); color: var(--muted); margin-top: 1px; }

/* ---------- Log (list view) ---------- */
.log { position: relative; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px)); }
.log-inner { max-width: 980px; margin: 0 auto; display: grid; gap: 36px; }
.log h1 { margin: 10px 0 0; font: 700 clamp(34px, 5vw, 54px)/1 var(--sans); letter-spacing: -0.03em; }
.log .lede { margin: 10px 0 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.principles { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 14px 0 0; list-style: none; }
.principles li { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.log h2 { margin: 0 0 12px; font: 600 13px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--glow); }
.log h2 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.ways-list b { font-weight: 600; }
.ways-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }
.ways-list a { display: grid; gap: 3px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); background: rgba(255, 255, 255, 0.02); }
.ways-list a:hover { border-color: var(--glow); }
.ways-list span { color: var(--muted); font-size: 14px; }
.levels { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 4px; }
.levels::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--glow), rgba(79, 240, 224, 0.1)); }
.levels li { position: relative; display: grid; gap: 4px; padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.levels li::before { content: ""; position: absolute; left: -26px; top: 18px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); background: var(--abyss); box-shadow: 0 0 10px var(--c); }
.levels .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.levels .head a { font-size: 21px; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.levels .head a:hover { color: var(--c); }
.levels .head span { font: 12px var(--mono); color: var(--muted); }
.levels p { margin: 0; color: #c4dde3; }
.levels .more { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.levels .more button { border: 0; background: none; padding: 0; font: inherit; color: var(--c); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chron { list-style: none; margin: 0; padding: 0; display: grid; }
.chron li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chron time { font: 12px var(--mono); color: var(--glow); padding-top: 3px; }
.chron b { font-weight: 600; }
.chron span { color: var(--muted); font-size: 14px; }
.foot { color: var(--faint); font-size: 13px; }

@media (max-width: 1180px) and (min-width: 861px) {
  .stop { width: 380px; }
  .gauge { width: 170px; }
  .history { left: 444px; right: 210px; }
}
@media (max-width: 860px) {
  .ways { display: none; }
  .stop { left: 10px; right: 10px; width: auto; bottom: 10px; padding: 14px 16px; gap: 8px; max-height: 52%; overflow: auto; }
  .stop h1 { font-size: 30px; }
  .stop h2 { font-size: 28px; }
  .stop p { font-size: 14px; }
  .gauge { right: 4px; width: 40px; top: 64px; bottom: auto; height: 40%; }
  .gauge .lvl span { display: none; }
  .gauge .here b { display: block; right: 34px; }
  .stop .ev { display: none; }
  .stop .key { gap: 3px 10px; font-size: 12px; }
  .stop .key-hint { display: none; }
  .stop .into { font-size: 13px; }
  .history { left: 10px; right: 10px; bottom: auto; top: 58%; }
  body.deep .history { display: none; }
  .cue { display: none; }
}
@media (prefers-reduced-motion: reduce) { .cue { animation: none; } .stop { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html"><i></i><b>Learning Systems</b></a>
  <div class="toggle" role="tablist" aria-label="View">
    <button role="tab" id="tab-dive" aria-selected="true" aria-controls="dive">Dive</button>
    <button role="tab" id="tab-log" aria-selected="false" aria-controls="log">List</button>
  </div>
  <nav class="ways" aria-label="Ways in">
    <a href="world/index.html#story">Watch the story</a>
    <a href="labs/index.html">Guided labs <small id="labs-done"></small></a>
  </nav>
  <span class="lang" data-lang-switch></span>
</header>

<main class="dive" id="dive" role="tabpanel" aria-labelledby="tab-dive">
  <div class="sim" id="sim-a"><canvas aria-hidden="true"></canvas><span class="status" hidden></span></div>
  <div class="sim" id="sim-b"><canvas aria-hidden="true"></canvas><span class="status" hidden></span></div>
  <canvas id="globe" aria-hidden="true"></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <canvas id="hit" tabindex="0" aria-label="The dive. Scroll, swipe or use the arrow keys to go deeper or back up. On the planet, drag to turn it and click a light to dive straight to that system."></canvas>
  <div class="cue" id="cue">Scroll to dive</div>
  <section class="stop" id="stop" aria-live="polite"></section>
  <div class="history" id="history" aria-label="The age of the planet">
    <div class="label"><span>Age of the planet<button id="today" type="button" hidden>Back to today</button></span><b id="age">Today</b></div>
    <div class="strip" id="strip"></div>
  </div>
  <nav class="gauge" id="gauge" aria-label="Depth"></nav>
  <div class="label-tip" id="tip" hidden></div>
</main>

<main class="log" id="log" role="tabpanel" aria-labelledby="tab-log" hidden></main>

<script src="lib/lab-catalogue.js"></script>
<script src="lib/system-catalogue.js"></script>
<script src="lib/plates.js"></script>
<script src="lib/planet.js"></script>
<script src="lib/globe.js"></script>
<script src="lib/creature-draw.js"></script>
<script src="lib/previews.js"></script>
<script src="home.js"></script>
</body>
</html>
